# nfpm configuration — builds the .deb and .rpm attached to GitHub releases.
# Run from the repo root after staging a release build:
#   meson setup build-pkg --buildtype=release --prefix=/usr
#   meson compile -C build-pkg
#   DESTDIR=$PWD/build-pkg/staging meson install -C build-pkg
#   LOGFL_VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   LOGFL_VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
#
# Dependency names follow sdr-for-linux's packaging (verified there against
# Ubuntu 24.04/Debian 13 and Fedora 40+); CI install-tests both packages in
# fresh containers and ldd-checks the binary before a release artifact is
# attached, so a renamed distro package fails the pipeline instead of the
# user.

name: log-for-linux
arch: amd64
platform: linux
version: ${LOGFL_VERSION}
section: hamradio
priority: optional
maintainer: Richard Fakenberg <rifak@protonmail.com>
vendor: OK1BR
homepage: https://github.com/OK1BR/log-for-linux
license: GPL-3.0-or-later
description: |
  Native GTK4/libadwaita ham radio logbook.
  Fast entry row with live worked-before/dup verdicts, searchable QSO table
  with inline editing, lossless ADIF import/export, contests with exchange
  templates, serials and Cabrillo export, CW contest messaging via TCI to
  sdr-for-linux, WSJT-X UDP auto-logging, and a duplicate lookup service
  for skimmer-for-linux. SQLite store, one file.

contents:
  - src: build-pkg/staging/usr/bin/log-for-linux
    dst: /usr/bin/log-for-linux
  - src: build-pkg/staging/usr/share/applications/cz.ok1br.log_for_linux.desktop
    dst: /usr/share/applications/cz.ok1br.log_for_linux.desktop
  - src: build-pkg/staging/usr/share/icons/hicolor/scalable/apps/cz.ok1br.log_for_linux.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cz.ok1br.log_for_linux.svg
  - src: build-pkg/staging/usr/share/metainfo/cz.ok1br.log_for_linux.metainfo.xml
    dst: /usr/share/metainfo/cz.ok1br.log_for_linux.metainfo.xml

overrides:
  deb:
    # Ubuntu 24.04+ / Debian 13+ (the t64 names post 64-bit time_t transition)
    depends:
      - libc6 (>= 2.39)
      - libgtk-4-1
      - libadwaita-1-0 (>= 1.5)
      - libglib2.0-0t64
      - libsqlite3-0
      - libwebsockets19t64
  rpm:
    # Fedora 40+
    depends:
      - gtk4
      - libadwaita >= 1.5
      - glib2
      - sqlite-libs
      - libwebsockets
